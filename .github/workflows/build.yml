name: Build Android APK

on:
  push:
    branches: [main, meta]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runner mặc định dùng JDK 25 — Gradle 8.13 không hỗ trợ, cố định JDK 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Get libclash.so (FlClash release → fallback source build)
        run: |
          set -e
          git config --global url."https://github.com/".insteadOf "git@github.com:"

          JNILIBS_CORE=android/core/src/main/jniLibs/arm64-v8a
          JNILIBS_APP=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNILIBS_CORE" "$JNILIBS_APP"

          # ── Try pre-built libclash.so from FlClash official release ────────
          echo "=== Fetching FlClash latest release ==="
          # Ghim v0.8.94: bản mới hơn (0.9.x) đổi API libclash (thiếu startTUN/invokeAction...) → link lỗi
          RELEASE_JSON=$(curl -sf "https://api.github.com/repos/chen08209/FlClash/releases/tags/v0.8.94" || true)

          if [ -n "$RELEASE_JSON" ]; then
            APK_URL=$(echo "$RELEASE_JSON" | grep '"browser_download_url"' \
              | grep -i 'android' | grep -i 'arm64' | grep -v 'universal' \
              | head -1 | cut -d'"' -f4)
            [ -z "$APK_URL" ] && APK_URL=$(echo "$RELEASE_JSON" | grep '"browser_download_url"' \
              | grep -i 'android' | head -1 | cut -d'"' -f4)
          fi

          if [ -n "$APK_URL" ]; then
            echo "Downloading: $APK_URL"
            if curl -sfL -o /tmp/flclash.apk "$APK_URL"; then
              mkdir -p /tmp/flclash_apk
              if unzip -o /tmp/flclash.apk "lib/arm64-v8a/libclash.so" -d /tmp/flclash_apk 2>/dev/null; then
                SO=/tmp/flclash_apk/lib/arm64-v8a/libclash.so
                if [ -f "$SO" ] && [ "$(stat -c%s "$SO")" -gt 1000000 ]; then
                  echo "✓ Got libclash.so from FlClash release ($(stat -c%s "$SO") bytes)"
                  cp "$SO" "$JNILIBS_CORE/libclash.so"
                  cp "$SO" "$JNILIBS_APP/libclash.so"
                  LIBCLASH_SOURCE=release
                fi
              fi
            fi
          fi

          # ── Fallback: build from source using FlClash's pinned mihomo submodule ──
          # (must match the API the bridge code in core/*.go was written against;
          # the latest mihomo Alpha HEAD renames/removes symbols and breaks the build)
          if [ "${LIBCLASH_SOURCE:-}" != "release" ]; then
            echo "=== Building libclash.so from source ==="
            git clone --depth=1 https://github.com/chen08209/FlClash.git /tmp/flclash
            cd /tmp/flclash
            git submodule update --init --depth=1 core/Clash.Meta
            cd -
            cp -r /tmp/flclash/core/Clash.Meta ./core/Clash.Meta

            NDK_CC=$(which aarch64-linux-android21-clang 2>/dev/null || \
                     find /usr/local/lib/android/sdk/ndk -name "aarch64-linux-android21-clang" 2>/dev/null | head -1 || \
                     find /opt -name "aarch64-linux-android*-clang" 2>/dev/null | head -1)
            test -n "$NDK_CC" || (echo "NDK clang not found!" && exit 1)

            cd core
            GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$NDK_CC" CFLAGS="-O3" \
              go build -ldflags="-w -s" -tags="with_gvisor" -buildmode=c-shared -o libclash.so .
            cd -
            cp core/libclash.so "$JNILIBS_CORE/libclash.so"
            cp core/libclash.so "$JNILIBS_APP/libclash.so"
            echo "✓ Built libclash.so from source"
          fi

          ls -lh "$JNILIBS_APP/libclash.so"

      - name: Get Flutter dependencies
        run: flutter pub get

      # Without a release keystore, Gradle falls back to the shared Android
      # debug certificate (and appends a ".dev" applicationId suffix) — that
      # untrusted, widely-reused cert is exactly what makes Play Protect show
      # scary "blocked for your security" warnings on install. The keystore
      # and its passwords live in GitHub Secrets (not in the repo) and get
      # reconstructed here so every build reuses the same signing key
      # (required for users to update without uninstalling first).
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Thiếu secret keystore — dừng để không ra APK ký debug (không cài đè được)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          # Gradle đọc rootProject = android/ → phải ghi vào android/local.properties
          # (trước đây ghi nhầm ra ./local.properties nên APK bị ký debug key ngẫu nhiên)
          touch android/local.properties
          sed -i '/^storePassword=/d;/^keyAlias=/d;/^keyPassword=/d' android/local.properties
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties
          keytool -list -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | tail -2

      # ── BUILD 1: VPN Store (client-user.jiangsuhk.com) ───────────────────
      - name: Build APK — VPN Store
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode tăng dần theo mỗi lần build → luôn cài đè được lên bản cũ
          BUILD_NUMBER=$((2026060000 + ${{ github.run_number }}))
          echo "versionCode=$BUILD_NUMBER"
          flutter build apk --release --no-tree-shake-icons --dart-define=APP_ENV=stable \
            --build-number=$BUILD_NUMBER \
            --obfuscate --split-debug-info=build/debug-info/vpnstore

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/certs.txt
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "APK đang ký bằng debug key — sai cấu hình ký"; exit 1
          fi
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          $AAPT dump badging build/app/outputs/flutter-apk/app-release.apk | head -1

      - name: Save VPN Store APK
        run: cp build/app/outputs/flutter-apk/app-release.apk /tmp/vpnstore-release.apk

      # ── UPLOAD BOTH ARTIFACTS ─────────────────────────────────────────────
      - name: Upload VPN Store APK
        uses: actions/upload-artifact@v4
        with:
          name: vpnstore-meta-apk
          path: /tmp/vpnstore-release.apk
          overwrite: true

